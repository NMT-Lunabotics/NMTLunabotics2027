serial:
  # Telemetry serial data to record from microcontroller
  telemetry:
    default_type: int8                                                 # Default data type 
    # Telemetry definitions
    abc:
      id: 'ABC'                                                        # Id of the telemetry recived
      type: telemetry_last                                             # Type, handles how data is managed, (telemetry_last, telemetry_repete, telemetry_state)
      data:                                                            # Purely visual label and data type of each bit of telemetry data
        - data:uint16
      topic: /abc                                                      # Topic to publish telemetry data to, leave blank '' to not publish topic
      message_type: std_msgs/msg/Float32                               # Message type of topic
      rate: 1.0                                                        # Depending on "type", this can be used to control how fast messages or published
      rate_mode: average                                               # Depending on "type", this controls how data over time is handled, (latest, average)
    motor_left_amps:
      id: 'TMSA'
      data:
        - data:float32
      topic: /current/motor_left
      message_type: std_msgs/msg/Float32
    motor_right_amps:
      id: 'BMSA'
      data:
        - data:float32
      topic: /current/motor_right
      message_type: std_msgs/msg/Float32
    actuator_arm_amps:
      id: 'A1SA'
      data:
        - data:float32
      topic: /current/actuator_arm
      message_type: std_msgs/msg/Float32
    actuator_bucket_amps:
      id: 'A3SA'
      data:
        - data:float32
      topic: /current/actuator_bucket
      message_type: std_msgs/msg/Float32
    driver_top_amps:
      id: 'TMDA'
      data:
        - data:float32
      topic: /current/driver_top
      message_type: std_msgs/msg/Float32
    driver_top_velocity:
      id: 'TMDV'
      data:
        - data:float32
      topic: /velocity/driver_top
      message_type: std_msgs/msg/Float32
    driver_top_fault:
      id: 'TOPDRIVERFAULT'
      data:
        - data:bool
      topic: /fault/driver_top
      message_type: std_msgs/msg/Bool
    driver_bottom_amps:
      id: 'BMDA'
      data:
        - data:float32
      topic: /current/driver_bottom
      message_type: std_msgs/msg/Float32
    driver_bottom_velocity:
      id: 'BMDV'
      data:
        - data:float32
      topic: /velocity/driver_bottom
      message_type: std_msgs/msg/Float32
    driver_bottom_fault:
      id: 'BOTTOMDRIVERFAULT'
      data:
        - data:bool
      topic: /fault/driver_bottom
      message_type: std_msgs/msg/Bool
  
  # Command serial data to send to the microcontroller
  commands:
    default_topic: /serial/command                                    # Default topic all data should be sent on if an indvudal topic is not defined
    default_type: int8                                                # If a command type is not defined default to this data type
    blocking_timer: 1.0                                               # How long do high priority commands block low priority commands
    # Command definitions
    motor:                                                            
      id: 'M'                                                         # Id of the command sent
      type: 'command'                                                 # The type of command: (none, command, cmd_vel, data_trigger, data_last, data_repete, data_state)
      data:                                                           # Purely visual label and data type of each bit of command data
        - left_motor:int8
        - right_motor:int8
    actuator:
      id: 'A'
      data: 
        - arm_velocity:int8
        - bucket_velocity:int8
        - arm_min_position:int8
        - arm_max_position:int8
        - bucket_min_position:int8
        - bucket_max_position:int8
    servo:
      id: 'S'
      type: 'command'
      data: 
        - angle:uint8
    estop:
      id: 'E'
      type: 'command'
      microcontrollers:                                              # Microcontroller that command defaults to, if not specified default to first one in microcontrollers list
        - main
      topic: /serial/estop                                            # Special topic for this indavidual command
      data:
        - state:bool
    # Published topic definitions
    autonomy_state:
      id: 'AUTO'
      type: 'data_state'
      topic: /scan  
      data:
        - state:bool
      rate: 1.0
      timeout: 5.0
      rate_mode: latest                                              # (latest, average)
    imu:
      id: 'imu:'
      type: 'data_last' 
      topic: /imu  
      message_type: sensor_msgs/msg/Imu
      data:
        - linear_acceleration.x:int8
        - linear_acceleration.y:int8
        - linear_acceleration.z:int8
        - angular_velocity.x:int8
        - angular_velocity.y:int8
        - angular_velocity.z:int8
      rate_mode: average
      rate: 1.0
    # cmd_vel definitions, cmd_vel is a special command case
    cmd_vel:    
      type: 'cmd_vel'                                                      
      topic: /cmd_vel                                                 # cmd_vel topic to use
      blocking_id: 0                                                  # The blocking id that the topic defaults to
      linear_direction: 1.0                                           # Linear direction control: reverse=-1.0, forword=1.0
      angular_direction: 1.0                                          # Angular direction control: reverse=-1.0, forword=1.0
    
  # Defines sketch paths for uploads
  sketches:
    main: Arduino/system_control_old/system_control_old.ino
    test_code: Arduino/test_code/incrament/incrament.ino
    random: Arduino/test_code/random_data/random_data.ino

  # Defines microcontroller settings/configs
  microcontrollers:
    main:                                                             # Microcontroller definition 
      # Should microcontroller be enabled
      enabled: true                                                   # Determins if board is enabled
      start_in_background: true  #TODO                                # Start node in background, requires that systemctl service is installed. This will run  replay and sensor logging if enabled
      # Microcontroller board settings
      port: ''                                                        # Device port, leave blank '' to auto detect
      baud_rate: 115200                                               # Buad rate, leave blank '' to auto detect
      # Connection settings
      timeout: 0.1                                                    # Serial timeout period
      reconnect_time: 3.0                                             # Auto board reconnect time, leave as -1.0 to disable
      restart: false                                                  # (Trigger), set to true to trigger microcontroller restart
      reset: false                                                    # (Trigger), set to true to trigger microcontroller reset
      # Replays
      replay_logging: true                                            # Determins if background replay logging is enabled
      replay_logging_folder: Logs/replays/main                        # Folder where background replays are stored
      replay_logging_include:
        - M
        - A
        - AUTO
      replay_logging_exclude:
      replay_playback: -1                       #TODO                 # (Trigger) does diffrent replay playback actions (-1=disable, 0=start, 1=stop)
      replay_playback_config: test.yaml         #TODO                 # The liva parma where replay is saved
      # Primary sensor logging
      sensor_logging: true                      #TODO
      sensor_logging_folder: Logs/sensors/main  #TODO                 # Folder where sensor logs are stored   
      sensor_logging_include:                   #TODO
      sensor_logging_exclude:                   #TODO
      # Sketch settings
      sketch: random                                                  # Id of global defined sketch to use, changing re-uplouds
      board: ''                                                       # The board type of this microcontroller i.e. 'arduino:avr:uno', leave blank '', to auto detect
      upload: false                                                   # (Trigger) uplouds current sketch
      upload_on_start: true                                           # If enabled sketches are uplouded when board initally connects
    secondary:
      enabled: false
      port: ''
      baud_rate: 115200
      timeout: 0.1

      reconnect_time: -1.0
      restart: false
      reset: false

# System that queues certain key data when system starts and keeps that in background for calulations like pot values
